<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Portal</title>
<style>
:root{--g:#16834a;--ink:#17211b;--muted:#68756d;--line:#dce6df;--bg:#f3f7f4}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
header{background:white;border-bottom:1px solid var(--line);padding:17px 20px}.head{max-width:960px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:#e5f4eb;color:var(--g);display:grid;place-items:center;font-weight:900}
.head h1{font-size:18px;margin:0}.head p{font-size:12px;color:var(--muted);margin:2px 0 0}
main{max-width:960px;margin:30px auto;padding:0 16px}.intro{text-align:center;margin-bottom:22px}.intro h2{font-size:26px;margin:0 0 6px}.intro p,.hint{color:var(--muted)}
.tabs{display:flex;gap:8px;justify-content:center;margin:20px 0}.tabs button{border:1px solid var(--line);background:white;padding:10px 18px;border-radius:10px;font-weight:650;cursor:pointer}.tabs button.active{background:var(--g);color:white}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 26px #1b39200a;margin:0 auto 18px;max-width:650px}.card h3{margin:0 0 5px}.hint{font-size:13px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:650;margin:13px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cfdad2;border-radius:10px;font:inherit;background:white}
input:focus,select:focus{outline:2px solid #b6e3c8;border-color:var(--g)}.primary{background:var(--g);border:0;color:white;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:17px}
.result{margin-top:16px;border:1px solid #b9dfc7;background:#f0faf3;border-radius:12px;padding:14px;display:none}.result a{display:inline-block;background:var(--g);color:white;text-decoration:none;padding:9px 14px;border-radius:8px;margin-top:10px;font-weight:650}
.notice{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;margin:15px auto;max-width:650px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.admin-list{max-width:900px;margin:auto}.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);padding:12px;border-radius:10px;margin-top:8px}.entry small{display:block;color:var(--muted)}
.del{border:1px solid #efb8b8;color:#b42318;background:white;border-radius:8px;padding:7px 10px;cursor:pointer}.hidden{display:none!important}.filelabel{border:1px dashed #a9b9ae;padding:12px;background:#fafcfb}
@media(max-width:600px){.row{grid-template-columns:1fr}.card{padding:17px}.intro h2{font-size:22px}.entry{align-items:flex-start}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">PDF</div><div><h1>PDF Portal</h1><p>Student document download system</p></div></div></header>
<main>
<div class="intro"><h2>Find Your PDF</h2><p>রোল ও রেজিস্ট্রেশন নম্বর দিয়ে নিজের PDF খুঁজে নাও</p></div>
<div class="tabs"><button id="studentTab" class="active" onclick="show('student')">Student</button><button id="adminTab" onclick="show('admin')">Admin</button></div>

<section id="student">
<div class="card">
<h3>ডকুমেন্ট খুঁজুন</h3><p class="hint">তোমার তথ্য দিয়ে সার্চ করো</p>
<label for="dept">Department</label>
<select id="dept"><option value="">Select department</option><option>Electrical and Electronic Engineering</option><option>Computer Science and Engineering</option><option>Civil Engineering</option></select>
<div class="row"><div><label for="roll">Roll Number</label><input id="roll" placeholder="যেমন: 250101"></div><div><label for="reg">Registration Number</label><input id="reg" placeholder="রেজিস্ট্রেশন নম্বর"></div></div>
<button class="primary" onclick="searchPDF()">Find My PDF</button><div class="result" id="result"></div>
</div>
</section>

<section id="admin" class="hidden">
<div class="card">
<h3>Admin: PDF যোগ করুন</h3><p class="hint">শিক্ষার্থীর তথ্য ও PDF ফাইল যুক্ত করো</p>
<div class="row"><div><label for="aDept">Department</label><select id="aDept"><option>Electrical and Electronic Engineering</option><option>Computer Science and Engineering</option><option>Civil Engineering</option></select></div>
<div><label for="type">Document Type</label><select id="type"><option>Lab Report</option><option>Assignment</option><option>Other</option></select></div></div>
<div class="row"><div><label for="aRoll">Roll Number</label><input id="aRoll" placeholder="Roll"></div><div><label for="aReg">Registration Number</label><input id="aReg" placeholder="Registration"></div></div>
<label for="studentName">Student Name (optional)</label><input id="studentName" placeholder="নাম">
<label for="pdf">PDF File</label><input class="filelabel" id="pdf" type="file" accept="application/pdf">
<button class="primary" onclick="addPDF()">Save PDF</button><p class="hint" id="adminMsg" aria-live="polite"></p>
</div>
<div class="admin-list"><h3>Saved PDFs <span id="count"></span></h3><div id="entries"></div></div>
</section>
<p class="notice">অনলাইন সংস্করণ: PDF ও তথ্য Supabase-এ সংরক্ষিত হবে।</p>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://hchvxasmcgsddyocsqej.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Ra1qV07o_aaaDS86TG4bag_iFcbbSOZ";
const BUCKET = "PDF Portal";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

window.show = function(w){
  document.getElementById('student').classList.toggle('hidden',w!=='student');
  document.getElementById('admin').classList.toggle('hidden',w!=='admin');
  document.getElementById('studentTab').classList.toggle('active',w==='student');
  document.getElementById('adminTab').classList.toggle('active',w==='admin');
  if(w==='admin') render();
};

window.searchPDF = async function(){
  const d=document.getElementById('dept').value;
  const r=document.getElementById('roll').value.trim();
  const g=document.getElementById('reg').value.trim();
  const o=document.getElementById('result');
  o.style.display='block';

  if(!d||!r||!g){o.textContent='Department, roll ও registration—সব তথ্য পূরণ করো।';return;}

  o.textContent='খোঁজা হচ্ছে...';

  const {data,error}=await supabase
    .from('pdf_records')
    .select('*')
    .eq('department',d)
    .eq('roll',r)
    .eq('registration',g)
    .maybeSingle();

  if(error){console.error(error);o.textContent='Search করতে সমস্যা হয়েছে।';return;}
  if(!data){o.textContent='কোনো PDF পাওয়া যায়নি। তথ্যগুলো আবার যাচাই করো।';return;}

  o.innerHTML='';
  const b=document.createElement('strong');
  b.textContent=(data.name?data.name+' — ':'')+data.document_type;
  const br=document.createElement('br');
  const s=document.createElement('span');
  s.textContent='Roll: '+data.roll+' | Registration: '+data.registration;
  const a=document.createElement('a');
  a.href=data.pdf_url;
  a.target='_blank';
  a.rel='noopener';
  a.download=data.filename;
  a.textContent='Download PDF';
  o.append(b,br,s,br,a);
};

window.addPDF = async function(){
  const d=document.getElementById('aDept').value;
  const r=document.getElementById('aRoll').value.trim();
  const g=document.getElementById('aReg').value.trim();
  const n=document.getElementById('studentName').value.trim();
  const t=document.getElementById('type').value;
  const f=document.getElementById('pdf').files[0];
  const m=document.getElementById('adminMsg');

  if(!r||!g||!f){m.textContent='রোল, রেজিস্ট্রেশন ও PDF ফাইল দিতে হবে।';return;}
  if(f.type!=='application/pdf'){m.textContent='শুধু PDF ফাইল আপলোড করো।';return;}

  m.textContent='Upload হচ্ছে...';

  const safeName=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=`${Date.now()}_${crypto.randomUUID()}_${safeName}`;

  const {error:uploadError}=await supabase.storage.from(BUCKET).upload(path,f,{
    contentType:'application/pdf',
    upsert:false
  });

  if(uploadError){console.error(uploadError);m.textContent='PDF upload হয়নি: '+uploadError.message;return;}

  const {data:urlData}=supabase.storage.from(BUCKET).getPublicUrl(path);
  const pdfUrl=urlData.publicUrl;

  const {error:dbError}=await supabase.from('pdf_records').insert({
    department:d, roll:r, registration:g, name:n||null,
    document_type:t, filename:f.name, pdf_url:pdfUrl
  });

  if(dbError){
    console.error(dbError);
    await supabase.storage.from(BUCKET).remove([path]);
    m.textContent='Database-এ তথ্য save হয়নি: '+dbError.message;
    return;
  }

  m.textContent='PDF সফলভাবে online save হয়েছে।';
  ['aRoll','aReg','studentName','pdf'].forEach(id=>document.getElementById(id).value='');
  render();
};

async function render(){
  const root=document.getElementById('entries');
  root.innerHTML='Loading...';

  const {data,error}=await supabase
    .from('pdf_records')
    .select('*')
    .order('created_at',{ascending:false});

  if(error){root.textContent='রেকর্ড load করা যাচ্ছে না।';return;}

  document.getElementById('count').textContent='('+data.length+')';

  if(!data.length){root.textContent='এখনো কোনো PDF যোগ করা হয়নি।';return;}

  root.innerHTML='';
  data.forEach(x=>{
    const d=document.createElement('div');d.className='entry';
    const l=document.createElement('div'),b=document.createElement('strong'),s=document.createElement('small'),a=document.createElement('a'),del=document.createElement('button');
    b.textContent=x.name||x.document_type;
    s.textContent=x.department+' · Roll '+x.roll+' · Reg '+x.registration;
    a.href=x.pdf_url;a.target='_blank';a.rel='noopener';a.textContent='Open PDF';a.style.marginRight='8px';
    del.className='del';del.textContent='Delete';
    del.onclick=()=>removePDF(x);
    l.append(b,s);d.append(l,a,del);root.append(d);
  });
}

async function removePDF(x){
  if(!confirm('এই PDF মুছে ফেলবে?')) return;

  // The current table stores the public URL. Extract the storage path from it.
  try{
    const marker='/storage/v1/object/public/'+encodeURIComponent(BUCKET)+'/';
    let path=x.pdf_url.split('/storage/v1/object/public/')[1] || '';
    if(path.startsWith(BUCKET+'/')) path=path.slice(BUCKET.length+1);
    path=decodeURIComponent(path);

    if(path){
      await supabase.storage.from(BUCKET).remove([path]);
    }
  }catch(e){console.warn('Storage delete warning:',e);}

  const {error}=await supabase.from('pdf_records').delete().eq('id',x.id);
  if(error){alert('Delete করতে সমস্যা হয়েছে: '+error.message);return;}
  render();
}

render();
</script>
</body>
</html>
